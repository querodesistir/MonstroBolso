
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-color: rgb(84, 130, 221);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>

    <script>
        let ns = Math.floor(Math.random() * 6) + 1;

        let nomeCenario = "";
        let imagemUrl = "";
        let bonusHabitat = 0;

        switch (ns) {
            case 1:
                nomeCenario = "bosque";
                imagemUrl = "imagem/bosque.png";
                bonusHabitat = 15;
                break;

            case 2:
                nomeCenario = "desfiladeiro";
                imagemUrl = "imagem/desfiladeiro.png";
                bonusHabitat = 15;
                break;

            case 3:
                nomeCenario = "pantano";
                imagemUrl = "imagem/pantano.png";
                bonusHabitat = 5;
                break;

            case 4:
                nomeCenario = "estradapedra";
                imagemUrl = "imagem/estradapedra.png";
                bonusHabitat = 5;
                break;

            case 5:
                nomeCenario = "praianoturna";
                imagemUrl = "imagem/praianoturna.png";
                bonusHabitat = 5;
                break;

            default:
                nomeCenario = "arena Padrão";
                imagemUrl = "imagem/padrao.png";
                bonusHabitat = 0;
                break;
        }

        document.body.style.backgroundImage = `url('${imagemUrl}')`;
    </script>

</body>
</html>
