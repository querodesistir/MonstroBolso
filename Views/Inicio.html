<script>
async function iniciarJogo() {

const menu = document.getElementById("menuJogo");
const mensagemErro = document.getElementById("erroInicializacao");

try {

    const resposta = await fetch("../Controllers/criarSessao.php", {
        method: "GET",
        credentials: "same-origin",
        cache: "no-store",
        headers: {
            "Accept": "application/json"
        }
    });

    if (!resposta.ok) {
        throw new Error(
            "Erro HTTP " + resposta.status +
            ". Verifique o caminho do criarSessao.php."
        );
    }

    const tipoResposta = resposta.headers.get("content-type") || "";

    if (!tipoResposta.includes("application/json")) {
        throw new Error(
            "O servidor não retornou JSON. Verifique o arquivo criarSessao.php."
        );
    }

    const dados = await resposta.json();

    if (!dados.ok || !dados.usuario || !dados.usuario.idsu) {
        throw new Error(
            dados.erro || "Não foi possível identificar o jogador."
        );
    }

    console.log("Jogador identificado:", dados.usuario);

    menu.hidden = false;
    mensagemErro.hidden = true;

} catch (erro) {

    console.error("Erro ao iniciar o jogo:", erro);

    mensagemErro.textContent =
        "Não foi possível iniciar o jogo. " + erro.message;

    mensagemErro.hidden = false;
    menu.hidden = true;
}
}

iniciarJogo();
</script>
