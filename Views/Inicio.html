<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreparandoFabrica</title>
    <style>

     body{
background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(imagens/backInicio.jpg);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    margin: 0;
     }
    ul {
        list-style: none;
   
    }
       .menu {
    width:100%;
    display:flex;
    justify-content:center;
    gap:30px;
    padding:77px  0;
    list-style-type: style none;
    margin: 0;
       }
       .menu li{
       background-color:rgb(143, 14, 14);
       border:3px solid;
       border-radius:12px;
       transition:transform 0,2s,background color 0,2;
       min-width: none; width: 400px;
       text-align:center;
       }
       .menu a{
        display:block;
        padding:20px 20px;
        color:black;
        text-decoration: none;
        font-family:sans-serif;
        font-weight:bold;
        font-size:30px;
       }
     
     .menu li:hover{
        background-color: aquamarine;
        transform:translateY(-5px);
        border-color:cadetblue;
     }  /* css da janela flutuante */
       dialog {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            padding: 25px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
       
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px); /* Deixa o fundo levemente borrado */
        }
        iframe {
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
    
</head>
<body>
       <script>
        document.addEventListener("DOMContentLoaded", () => {
            const janela = document.getElementById('janelaBloqueio');

    // Pergunta para o PHP se o usuário está logado
            fetch('Usulogado.php')
                .then(resposta => resposta.json())
                .then(dados => {
      if (dados.logado === false) {
         janela.showModal(); // Força a abertura da janela flutuante por cima de tudo
       } else {
    console.log("Usuário autenticado com sucesso: " + dados.apelido);
                    }
       })
                .catch(erro => console.error("Erro na comunicação com o servidor:", erro));
        });
    </script>

   <nav class="menu">
        <ul>
           
            <li><a>Perfil</a></li>
            <li><a href="">Time</a></li>
            <li><a href="arena.html">Hub de batalha</a></li>
            <li><a href="">loja</a></li>
        </ul>
    </nav>

    <dialog id="janelaBloqueio">
        <h2>Acesso não autorizado!</h2>
        <p>Não encontramos seu usuário ativo no sistema. Por favor, identifique-se abaixo:</p>
        
        <!-- era para mostrar login se não estiver logado -->
        <iframe src="login.html" width="450" height="350"></iframe>
    </dialog>
</body>
</html>
