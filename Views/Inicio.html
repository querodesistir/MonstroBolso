<script>

async function iniciarJogo() {

    const menu = document.getElementById("menuJogo");
    const mensagemErro = document.getElementById("erroInicializacao");

    try {

        const resposta = await fetch("../Controllers/criarSessao.php", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
                "Accept": "application/json"
            }
        });

        const texto = await resposta.text();

        let dados;

        try {
            dados = JSON.parse(texto);
        } catch (erro) {
            console.error("Resposta recebida do PHP:", texto);
            throw new Error("O servidor não retornou um JSON válido.");
        }
console.log("Status HTTP:", resposta.status);
console.log("Resposta completa:", JSON.stringify(dados, null, 2));
        if (!resposta.ok || !dados.ok) {
            throw new Error(
                dados.detalhe || dados.erro || "Falha ao iniciar o jogador."
            );
        }

        if (!dados.usuario || !dados.usuario.idsu) {
            throw new Error("O jogador não foi identificado.");
        }

        if (menu) {
            menu.hidden = false;
        }

        if (mensagemErro) {
            mensagemErro.hidden = true;
        }

    } catch (erro) {

        console.error("Erro ao iniciar o jogo:", erro);

        if (mensagemErro) {
            mensagemErro.textContent = erro.message;
            mensagemErro.hidden = false;
        }

        if (menu) {
            menu.hidden = true;
        }
    }
}

iniciarJogo();
</script>
