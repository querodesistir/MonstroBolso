<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const erro = parametros.get('erro');

        if (erro === 'campos') {
            alert('Login interrompido: preencha o e-mail e a senha.');
        } else if (erro === 'credenciais') {
            alert('Login falhou: e-mail ou senha incorretos. Já fez seu cadastro?');
        }
    </script>

    <form action="../Controllers/login.php" method="POST">

        <label for="mail">E-mail</label><br>
        <input type="email" id="mail" name="mail" placeholder="Ex.: jojo@gmail.com" required> <br>
        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required> <br>
        <button type="submit">Entrar</button>
    </form>
    <br>
    <a href="cadastro.html">Cadastrar</a>

</body>
</html>
