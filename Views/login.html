<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <script>
const parametros = new URLSearchParams(window.location.search);
const erro = parametros.get('erro');

if (erro === 'campos') {
    alert('Login interrompido: preencha o e-mail e a senha.');
} else if (erro === 'credenciais') {
    alert('Login falhou: e-mail ou senha incorretos. Já fez seu cadastro?');
}
</script>
    <form action="../Controllers/login.php" method="post" enctype="multipart/form-data">
<label for="login"> Email </label><br>
<input type="text" id="mail" name="mail" placeholder="Ex.:jojo@gmail.com">
<label for="senha"> Senha </label><br>
<input type="text" id="senha" name="senha" placeholder="ex.: Jojo*123">
<br><button type="submit">Entrar</button><br>
</form>

<a href="cadastro.html">Cadastrar</a>
</body>
</html>
